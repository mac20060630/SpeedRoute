name: Android Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build with Gradle
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Prepare APK for Release
        run: |
          # The APK is generated in android/app/build/outputs/apk/release/
          # Copy it to the workspace root for the release action
          cp android/app/build/outputs/apk/release/*.apk ./SpeedRoute-${{ github.ref_name }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: SpeedRoute-${{ github.ref_name }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
